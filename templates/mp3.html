<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeckCastDJ - MP3 Player</title>
<style>
/* ==========================================================================
   THEME DEFINITIONS & DESIGN TOKENS
   ========================================================================== */
:root {
    /* Default Dark Theme */
    --bg-body: #141518;
    --bg-panel: #1e2025;
    --bg-card: #262930;
    --bg-control: #2e323b;
    --bg-input: #1a1c21;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --text-header: #10b981;
    --accent-primary: #10b981;
    --accent-hover: #059669;
    --border-color: #374151;
    --slider-track: #374151;
    --slider-thumb: #10b981;
    --shadow-color: rgba(0, 0, 0, 0.45);
    
    /* DJ Deck Color Identities */
    --deck-a-color: #06b6d4;      /* Cyan Deck A */
    --deck-a-glow: rgba(6, 182, 212, 0.35);
    --deck-b-color: #f59e0b;      /* Amber Deck B */
    --deck-b-glow: rgba(245, 158, 11, 0.35);

}

/* Light Theme */
.theme-light {
    --bg-body: #eceff1;
    --bg-panel: #ffffff;
    --bg-card: #f8fafc;
    --bg-control: #e2e8f0;
    --bg-input: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --text-header: #15803d;
    --accent-primary: #16a34a;
    --accent-hover: #15803d;
    --border-color: #cbd5e1;
    --slider-track: #cbd5e1;
    --slider-thumb: #16a34a;
    --shadow-color: rgba(0, 0, 0, 0.08);

    --deck-a-color: #0284c7;
    --deck-a-glow: rgba(2, 132, 199, 0.25);
    --deck-b-color: #d97706;
    --deck-b-glow: rgba(217, 119, 6, 0.25);
}

/* Blue Night Theme */
.theme-blue {
    --bg-body: #0b1120;
    --bg-panel: #131d33;
    --bg-card: #1c2a47;
    --bg-control: #25375c;
    --bg-input: #0b1120;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
    --text-header: #38bdf8;
    --accent-primary: #0ea5e9;
    --accent-hover: #38bdf8;
    --border-color: #334e7a;
    --slider-track: #25375c;
    --slider-thumb: #38bdf8;
    --shadow-color: rgba(0, 0, 0, 0.55);

    --deck-a-color: #38bdf8;
    --deck-a-glow: rgba(56, 189, 248, 0.4);
    --deck-b-color: #c084fc;
    --deck-b-glow: rgba(192, 132, 252, 0.4);
}

/* Warm Orange Theme */
.theme-orange {
    --bg-body: #1c130e;
    --bg-panel: #2a1d17;
    --bg-card: #38271f;
    --bg-control: #483329;
    --bg-input: #1c130e;
    --text-main: #ffedd5;
    --text-muted: #d6b89e;
    --text-header: #f97316;
    --accent-primary: #ea580c;
    --accent-hover: #f97316;
    --border-color: #5c4134;
    --slider-track: #483329;
    --slider-thumb: #fb923c;
    --shadow-color: rgba(0, 0, 0, 0.55);

    --deck-a-color: #fb923c;
    --deck-a-glow: rgba(251, 146, 60, 0.4);
    --deck-b-color: #facc15;
    --deck-b-glow: rgba(250, 204, 21, 0.4);
}

/* ==========================================================================
   GLOBAL LAYOUT & BASE STYLES
   ========================================================================== */
* {
    box-sizing: border-box;
}

body {
    background-color: var(--bg-body);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 16px 20px 40px;
    transition: background-color 0.3s, color 0.3s;
}

a {
    color: var(--accent-primary);
    text-decoration: none;
}
a:hover {
    text-decoration: underline;
}

.app-container {
    max-width: 1400px;
    margin: 0 auto;
}

/* Header & Nav */
.header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 12px;
}

.header-title {
    margin: 0;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--text-header);
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-badge {
    background-color: var(--bg-control);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 9999px;
    border: 1px solid var(--border-color);
}

/* Global Controls / Theme Bar */
.global-controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

.theme-select {
    background-color: var(--bg-input);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
}

.theme-select:focus {
    border-color: var(--accent-primary);
}

/* ==========================================================================
   UNIFIED SEARCH, QUEUES & DIRECTORY BAR STYLES
   ========================================================================== */
.search-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    background-color: var(--bg-panel);
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 12px var(--shadow-color);
    flex-wrap: wrap;
}

.search-input-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 1 auto;
}

.search-input-wrap input[type="text"] {
    width: 180px;
    font-size: 13px;
}

.btn-search-action {
    padding: 7px 14px;
    font-size: 12px;
}

.btn-clear-search {
    background-color: #4b5563;
    padding: 7px 12px;
    font-size: 12px;
}
.btn-clear-search:hover {
    background-color: #374151;
}

.btn-load-ques {
    background-color: var(--bg-control);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 7px 14px;
    font-size: 12px;
    white-space: nowrap;
}
.btn-load-ques:hover {
    background-color: var(--accent-primary);
    color: #ffffff;
    border-color: var(--accent-primary);
}

.dir-dropdown-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1 1 auto;
    margin-left: auto;
    max-width: 550px;
}

.dir-select {
    background-color: var(--bg-input);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 7px 12px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    width: 100%;
    max-width: 500px;
    min-width: 250px;
    text-overflow: ellipsis;
    transition: border-color 0.2s;
}

.dir-select:focus {
    border-color: var(--accent-primary);
}

/* Common Buttons */
button, input[type="button"] {
    background-color: var(--accent-primary);
    color: #ffffff;
    border: none;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.1s;
}

button:hover, input[type="button"]:hover {
    background-color: var(--accent-hover);
}

button:active, input[type="button"]:active {
    transform: scale(0.98);
}

input[type="text"] {
    background-color: var(--bg-input);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 7px 10px;
    border-radius: 5px;
    font-size: 13px;
    outline: none;
}

input[type="text"]:focus {
    border-color: var(--accent-primary);
}

/* ==========================================================================
   DECK SECTION (DUAL CDJ / DJ PLAYER SYSTEM)
   ========================================================================== */
.decks-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
}

@media (max-width: 960px) {
    .decks-container {
        grid-template-columns: 1fr;
    }
}

.deck {
    background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-card) 100%);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: 0 8px 20px var(--shadow-color);
    border: 1px solid var(--border-color);
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
}

/* Deck Header Bar */
.deck-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 10px;
}

.deck-tag {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 5px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

#deck1 .deck-tag {
    background: rgba(6, 182, 212, 0.15);
    color: var(--deck-a-color);
    border: 1px solid var(--deck-a-color);
}

#deck2 .deck-tag {
    background: rgba(245, 158, 11, 0.15);
    color: var(--deck-b-color);
    border: 1px solid var(--deck-b-color);
}

.deck.is-playing#deck1 {
    border-color: var(--deck-a-color);
    box-shadow: 0 0 16px var(--deck-a-glow);
}

.deck.is-playing#deck2 {
    border-color: var(--deck-b-color);
    box-shadow: 0 0 16px var(--deck-b-glow);
}

.deck-meta-badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--bg-control);
    padding: 4px 8px;
    border-radius: 4px;
    font-family: monospace;
}

/* Track Title Box */
.track-card {
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
    min-height: 48px;
    display: flex;
    align-items: center;
    overflow: hidden;
}

.track-card-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
}

/* Visualizer Area: Platter + Waveform */
.deck-visualizer-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
}

/* Animated Vinyl Turntable Platter */
.platter-wrap {
    flex-shrink: 0;
    width: 86px;
    height: 86px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.vinyl-platter {
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: radial-gradient(circle, #1a1a1a 18%, #111111 20%, #2a2a2a 22%, #111111 40%, #2a2a2a 42%, #111111 60%, #2a2a2a 62%, #111111 80%, #222222 82%, #111111 100%);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6), inset 0 0 4px rgba(255, 255, 255, 0.1);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease-out;
}

.vinyl-label {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 900;
    color: #ffffff;
    box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.5);
    position: relative;
}

#deck1 .vinyl-label {
    background: var(--deck-a-color);
}

#deck2 .vinyl-label {
    background: var(--deck-b-color);
}

.vinyl-center-hole {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #000000;
    border: 1px solid rgba(255, 255, 255, 0.3);
}

@keyframes spinPlatter {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

.deck.is-playing .vinyl-platter {
    animation: spinPlatter 2s linear infinite;
}

/* Interactive Waveform Display */
.waveform-box {
    flex-grow: 1;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 10px 12px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 86px;
}

.waveform-canvas {
    width: 100%;
    height: 48px;
    cursor: pointer;
    display: block;
}

.waveform-time-row {
    display: flex;
    justify-content: space-between;
    font-family: monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    margin-top: 4px;
}

.waveform-time-current {
    color: var(--text-main);
}

/* DJ Tactile Controls Bar */
.dj-controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background-color: var(--bg-control);
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}

.dj-btn-group {
    display: flex;
    align-items: center;
    gap: 6px;
}

.btn-dj-play {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 800;
    border-radius: 6px;
}

#deck1 .btn-dj-play {
    background-color: var(--deck-a-color);
}
#deck2 .btn-dj-play {
    background-color: var(--deck-b-color);
}

.btn-dj-cue {
    background-color: #374151;
    color: #f3f4f6;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
}
.btn-dj-cue:hover {
    background-color: #4b5563;
}

.btn-dj-restart {
    background-color: transparent;
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 7px 11px;
}
.btn-dj-restart:hover {
    background-color: var(--bg-card);
}

/* Speed / Pitch Pill Buttons */
.speed-pill-group {
    display: flex;
    align-items: center;
    background-color: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 2px;
    gap: 2px;
}

.speed-label {
    font-size: 10px;
    font-weight: 800;
    color: var(--text-muted);
    padding: 0 6px;
    text-transform: uppercase;
}

.speed-pill {
    background: transparent;
    color: var(--text-muted);
    border: none;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
}

.speed-pill:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.05);
}

.speed-pill.active {
    color: #ffffff;
    font-weight: 800;
}

#deck1 .speed-pill.active {
    background-color: var(--deck-a-color);
}

#deck2 .speed-pill.active {
    background-color: var(--deck-b-color);
}

/* Deck URL Load Form */
.deck-url-row {
    display: flex;
    gap: 8px;
    align-items: center;
}

.deck-url-input {
    flex-grow: 1;
    font-size: 12px;
    padding: 7px 10px;
}

/* Hidden/Embedded Audio Engine */
.deck-audio-engine {
    display: none;
}

/* ==========================================================================
   MIXER CONSOLE & CROSSFADER
   ========================================================================== */
.mixer-console {
    background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-card) 100%);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid var(--border-color);
    box-shadow: 0 8px 20px var(--shadow-color);
}

.mixer-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.5px;
}

.deck-a-indicator {
    color: var(--deck-a-color);
}

.deck-b-indicator {
    color: var(--deck-b-color);
}

/* Dual Channel Volume Gauges */
.ch-vol-meters {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 16px;
}

.ch-vol-bar-wrap {
    flex: 1;
    height: 8px;
    background: var(--bg-input);
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid var(--border-color);
}

.ch-vol-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.1s linear;
}

#chFillA {
    background: var(--deck-a-color);
    width: 100%;
}

#chFillB {
    background: var(--deck-b-color);
    width: 100%;
}

/* Crossfader Track & Slider */
.fader-action-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

.fader-track-container {
    flex-grow: 1;
    position: relative;
    display: flex;
    align-items: center;
}

.fader-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 16px;
    background: var(--slider-track);
    border-radius: 8px;
    outline: none;
    border: 1px solid var(--border-color);
    cursor: ew-resize;
    position: relative;
    z-index: 2;
}

.fader-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 36px;
    height: 38px;
    background: linear-gradient(180deg, #f0f0f0 0%, #a8a8a8 100%);
    border: 2px solid #333333;
    border-radius: 4px;
    cursor: ew-resize;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
}

.fader-slider::-moz-range-thumb {
    width: 36px;
    height: 38px;
    background: linear-gradient(180deg, #f0f0f0 0%, #a8a8a8 100%);
    border: 2px solid #333333;
    border-radius: 4px;
    cursor: ew-resize;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.6);
}

.fader-center-notch {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 2px;
    height: 28px;
    background: rgba(255, 255, 255, 0.4);
    z-index: 1;
    pointer-events: none;
}

.fader-auto-btn {
    background-color: var(--bg-control);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 9px 14px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
}

.fader-auto-btn:hover {
    background-color: var(--accent-primary);
    color: #ffffff;
    border-color: var(--accent-primary);
}

/* ==========================================================================
   TRANSPORT SECTION (COMPACT BAR)
   ========================================================================== */
.transport-card {
    background: var(--bg-panel);
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 16px;
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 12px var(--shadow-color);
}

.transport-main-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

.transport-nav-buttons {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.transport-buttons-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-left: auto;
}

.btn-stop-all {
    background-color: #dc2626;
    padding: 7px 16px;
    font-size: 12px;
}
.btn-stop-all:hover {
    background-color: #b91c1c;
}

.btn-clear-all {
    background-color: #4b5563;
    padding: 7px 14px;
    font-size: 12px;
}
.btn-clear-all:hover {
    background-color: #374151;
}

/* ==========================================================================
   COMPACT & PROFESSIONAL PLAYLIST & TRACK LISTING
   ========================================================================== */
.playlist-section {
    background: var(--bg-panel);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 12px var(--shadow-color);
    text-align: left;
}

/* Compact Folder Header */
.compact-folder-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 12px;
    background: var(--bg-card);
    border-radius: 7px;
    border: 1px solid var(--border-color);
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 8px;
}

.folder-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.folder-name {
    font-size: 14px;
    font-weight: 800;
    color: var(--text-header);
    letter-spacing: 0.3px;
}

.folder-meta-pill {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg-control);
    padding: 2px 8px;
    border-radius: 9999px;
    border: 1px solid var(--border-color);
}

.folder-actions-wrap {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
}

.btn-compact-action {
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
}

.btn-clear-dim {
    background-color: #4b5563;
}
.btn-clear-dim:hover {
    background-color: #374151;
}

/* Track List Container */
.track-list-wrap {
    border: 1px solid var(--border-color);
    border-radius: 7px;
    overflow: hidden;
    background: var(--bg-card);
}

/* Track Row */
.track-row {
    display: flex;
    align-items: center;
    padding: 4px 10px;
    min-height: 29px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    gap: 8px;
    transition: background 0.12s;
}

.track-row:last-child {
    border-bottom: none;
}

.track-row:hover {

<script>
// ==========================================================================
// DECKCAST DJ CLIENT LOGIC
// ==========================================================================

const mp3BaseUrl = 'http://pi86.sytes.net:8080/music/';
var mp3DB;
const infoDictionary = {};

// Mixer & Slider handles
var slider = document.getElementById("mixer");
var mixerOutput = document.getElementById("mixerValue");
var chFillA = document.getElementById("chFillA");
var chFillB = document.getElementById("chFillB");
var volValA = document.getElementById("volValA");
var volValB = document.getElementById("volValB");

if (slider && mixerOutput) {
    mixerOutput.innerHTML = slider.value;
    slider.oninput = function () {
        changePlayerVolume(Number(this.value));
    };
}

// Queue, mix & tracking state
var currentTracks = [];
var trackIndex = 0;
var playingTracks = false;
var queTracks = [];
var savedQueList = {};
var playMix = false;
var stopMix = new Array();
var stopMixIndex = 0;
var mixSeekTime = 0;

// ==========================================================================
// PLYR INITIALIZATION
// ==========================================================================
const player1 = new Plyr('#player1', {
    speed: { selected: 1, options: [1, 1.03, 1.05, 1.07] },
    controls: []
});

const player2 = new Plyr('#player2', {
    speed: { selected: 1, options: [1, 1.03, 1.05, 1.07] },
    controls: []
});

// ==========================================================================
// INTERACTIVE WAVEFORM ENGINE (HTML5 CANVAS)
// ==========================================================================
class DeckWaveform {
    constructor(canvasId, player, deckNum) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
        this.player = player;
        this.deckNum = deckNum;
        this.peaks = [];
        this.barCount = 130;
        this.isDragging = false;
        
        this.generateDefaultPeaks("deck_" + deckNum);
        this.initCanvasEvents();
        this.draw(0);
    }

    generateDefaultPeaks(seedString) {
        this.peaks = [];
        let seed = 0;
        for (let i = 0; i < seedString.length; i++) {
            seed = ((seed << 5) - seed) + seedString.charCodeAt(i);
            seed |= 0;
        }

        function pseudoRandom() {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        }

        for (let i = 0; i < this.barCount; i++) {
            let progress = i / this.barCount;
            let envelope = Math.sin(progress * Math.PI);
            let harmonic = 0.5 + 0.5 * Math.sin(progress * 14);
            let rawPeak = (pseudoRandom() * 0.55 + harmonic * 0.35 + 0.1) * envelope;
            let peak = Math.max(0.12, Math.min(0.96, rawPeak));
            this.peaks.push(peak);
        }
    }

    setTrack(title) {
        this.generateDefaultPeaks(title || ("track_" + this.deckNum));
        this.draw(0);
    }

    initCanvasEvents() {
        if (!this.canvas) return;

        const seekToPos = (e) => {
            const rect = this.canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
            const pos = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            
            if (this.player && this.player.duration) {
                this.player.currentTime = pos * this.player.duration;
                this.draw(pos);
            }
        };

        this.canvas.addEventListener('mousedown', (e) => {
            this.isDragging = true;
            seekToPos(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (this.isDragging) seekToPos(e);
        });

        window.addEventListener('mouseup', () => {
            this.isDragging = false;
        });

        this.canvas.addEventListener('touchstart', (e) => {
            this.isDragging = true;
            seekToPos(e);
        }, { passive: true });

        this.canvas.addEventListener('touchmove', (e) => {
            if (this.isDragging) seekToPos(e);
        }, { passive: true });

        this.canvas.addEventListener('touchend', () => {
            this.isDragging = false;
        });
    }

    draw(progress = 0) {
        if (!this.ctx || !this.canvas) return;
        const width = this.canvas.width;
        const height = this.canvas.height;
        const ctx = this.ctx;

        ctx.clearRect(0, 0, width, height);

        const computedStyle = getComputedStyle(document.body);
        const playedColor = (this.deckNum === 1) 
            ? (computedStyle.getPropertyValue('--deck-a-color').trim() || '#06b6d4')
            : (computedStyle.getPropertyValue('--deck-b-color').trim() || '#f59e0b');
        const unplayedColor = computedStyle.getPropertyValue('--border-color').trim() || '#374151';

        const totalBars = this.peaks.length;
        const barWidth = Math.max(2, (width / totalBars) - 1.5);
        const barSpacing = width / totalBars;

        for (let i = 0; i < totalBars; i++) {
            const barProgress = i / totalBars;
            const barHeight = this.peaks[i] * (height - 6);
            const x = i * barSpacing;
            const y = (height - barHeight) / 2;

            if (barProgress <= progress) {
                ctx.fillStyle = playedColor;
            } else {
                ctx.fillStyle = unplayedColor;
            }

            ctx.beginPath();
            ctx.roundRect(x, y, barWidth, barHeight, 2);
            ctx.fill();
        }

        const cursorX = progress * width;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(Math.max(0, cursorX - 1.5), 0, 3, height);
    }
}

// Instantiate waveforms
const waveform1 = new DeckWaveform('waveformCanvas1', player1, 1);
const waveform2 = new DeckWaveform('waveformCanvas2', player2, 2);

function formatTime(sec) {
    if (isNaN(sec) || sec < 0) return "00:00";
    const minutes = Math.floor(sec / 60);
    const seconds = Math.floor(sec % 60);
    return String(minutes).padStart(2, '0') + ":" + String(seconds).padStart(2, '0');
}

// ==========================================================================
// DECK PLAY STATE & EVENT HANDLERS
// ==========================================================================
function updateDeckPlayState(deckNum, isPlaying) {
    const deckEl = document.getElementById("deck" + deckNum);
    const playBtn = document.getElementById("playBtn" + deckNum);
    const metaBadge = document.getElementById("deckMeta" + deckNum);

    if (deckEl) {
        if (isPlaying) {
            deckEl.classList.add("is-playing");
            if (playBtn) playBtn.innerHTML = "⏸ PAUSE";
            if (metaBadge) metaBadge.textContent = "PLAYING";
        } else {
            deckEl.classList.remove("is-playing");
            if (playBtn) playBtn.innerHTML = "▶ PLAY";
            if (metaBadge) metaBadge.textContent = "PAUSED";
        }
    }
}

player1.on('playing', () => {
    updateDeckPlayState(1, true);
    console.log("Player 1 Playing. Duration: " + player1.duration);
});

player1.on('pause', () => {
    updateDeckPlayState(1, false);
});

player1.on('timeupdate', () => {
    const dur = player1.duration || 1;
    const cur = player1.currentTime || 0;
    const pct = cur / dur;
    waveform1.draw(pct);

    const elCurrent = document.getElementById("timeElapsed1");
    const elRem = document.getElementById("timeRemaining1");
    if (elCurrent) elCurrent.textContent = formatTime(cur);
    if (elRem) elRem.textContent = "-" + formatTime(Math.max(0, dur - cur));
});

player2.on('playing', () => {
    updateDeckPlayState(2, true);
    console.log("Player 2 Playing. Duration: " + player2.duration);
});

player2.on('pause', () => {
    updateDeckPlayState(2, false);
});

player2.on('timeupdate', () => {
    const dur = player2.duration || 1;
    const cur = player2.currentTime || 0;
    const pct = cur / dur;
    waveform2.draw(pct);

    const elCurrent = document.getElementById("timeElapsed2");
    const elRem = document.getElementById("timeRemaining2");
    if (elCurrent) elCurrent.textContent = formatTime(cur);
    if (elRem) elRem.textContent = "-" + formatTime(Math.max(0, dur - cur));
});

player1.on('loadeddata', async () => {
    waveform1.draw(0);
    const meta = document.getElementById("deckMeta1");
    if (meta && player1.duration) {
        meta.textContent = formatTime(player1.duration);
    }
    if (playMix && mixSeekTime !== 0) {
        console.log("Player 1 Start @ " + mixSeekTime);
        player1.forward(Number(mixSeekTime));
        await wait(500);
        player1.play();
    }
});

player2.on('loadeddata', async () => {
    waveform2.draw(0);
    const meta = document.getElementById("deckMeta2");
    if (meta && player2.duration) {
        meta.textContent = formatTime(player2.duration);
    }
    if (playMix && mixSeekTime !== 0) {

function loadMP3FromButton(mp3Name, playerNum) {

}

function loadMP3WithSeek(mp3Name, playerNum, seekTime) {
    let mp3Url = mp3BaseUrl + mp3Name;
    let mp3Title = getTitle(mp3Url);
    mp3Url = encodeURI(mp3Url);
    loadMP3(mp3Url, mp3Title, playerNum, seekTime, mp3Name);
}

function loadMP3(mp3Url, mp3Title, playerNum, seekTime = 0, mp3Name = '') {
    let player = (playerNum === 1) ? player1 : player2;
    let waveform = (playerNum === 1) ? waveform1 : waveform2;

    mp3Title = `[${trackIndex + 1}] ${mp3Title}`;

    let isFlac = mp3Url.toLowerCase().endsWith('.flac') || mp3Name.toLowerCase().endsWith('.flac');
    let mimeType = isFlac ? 'audio/flac' : 'audio/mp3';

    player.source = {
        type: 'audio',
        title: mp3Title,
        sources: [
            {
                src: mp3Url,
                type: mimeType,
            }
        ]
    };

    if (seekTime !== 0) {
        mixSeekTime = seekTime;
    } else {
        player.play();
    }

    if (waveform) {
        waveform.setTrack(mp3Title);
    }

    let trackInfo = "?";
    if (infoDictionary[mp3Name]) {
        trackInfo = infoDictionary[mp3Name][0];
    }

    const titleEl = document.getElementById("title" + playerNum);
    if (titleEl) {
        titleEl.innerHTML = `<b>${mp3Title} | ${trackInfo}</b>`;
    }

    const inputEl = document.getElementById("videoId" + playerNum);
    if (inputEl) inputEl.value = '';

    console.log("Loaded Track: " + mp3Title + " -> " + mp3Url);
}

function getTitle(mp3Url) {
    mp3Url = decodeURIComponent(mp3Url);
    let lastParts = mp3Url.split('/').slice(-2).join("/");
    return lastParts.replaceAll("_", " ");

// Mix automation
async function startMixPlay() {
    let startVideo = document.getElementById("m_start").value - 1;
    let overlap = Number(document.getElementById("m_overlap").value);
    let playTime = Number(document.getElementById("m_play").value);
    let startTime = 0;
    
    mixSeekTime = 0;
    currentTracks = queTracks;

    let stopIndex = stopMixIndex;
    stopMix[stopIndex] = false;
    playMix = true;

    if (startVideo < 0 || startVideo >= currentTracks.length) {
        startVideo = 0;
    }

    for (let i = startVideo; i < currentTracks.length; i++) {
        let mp3Name = currentTracks[i];
        let trackInfo = infoDictionary[mp3Name];
        let trackNum = i + 1;

        let message = "Current Mix Track: " + trackNum + " / Playtime: " + toHHMMSS(playTime);
        const msgEl = document.getElementById("messageText");
        if (msgEl) msgEl.innerHTML = message;

        if (i != startVideo) {
            startTime = overlap;
        }

        let waitTime = playTime;
        if (trackInfo) {
            let trackLength = Number(trackInfo[1]);
            if (trackLength <= 15) {
                console.log("Skipping Track: " + mp3Name);
                continue;
            }

            let endTime = overlap + playTime;
            if (endTime >= trackLength) {
                waitTime = trackLength - (overlap + 5);
                if (waitTime < 0) waitTime = 0;
            }
        }

        if (i % 2 === 0) {
            console.log("Mix Player 1: " + mp3Name);
            moveSlideTo(1);
            loadMP3WithSeek(mp3Name, 1, startTime);
        } else {
            console.log("Mix Player 2: " + mp3Name);
            moveSlideTo(2);
            loadMP3WithSeek(mp3Name, 2, startTime);
        }

        await wait(waitTime * 1000);

        if (stopMix[stopIndex]) {
            console.log("Stopping Mix @ " + i);
            break;
        }
    }

    playMix = false;
    console.log("Mix Play Done ...");
}

function wait(timeout) {
    return new Promise((resolve) => setTimeout(resolve, timeout));
}

function toHHMMSS(seconds) {
    const date = new Date(null);
    date.setSeconds(Number(seconds) || 0);
    return date.toISOString().slice(11, 19);
}

function moveSlideTo(playerNum) {
    var steps = 300;
    var mixStart = Number(slider.value);
    var mixStep = (playerNum === 1) ? (mixStart / steps) : ((100 - mixStart) / steps);

    for (let i = 1; i <= steps; i++) {
        setTimeout(function timer() {
            let mixRatio = (playerNum === 1) ? Math.round(mixStart - mixStep * i) : Math.round(mixStart + mixStep * i);
            if (slider) slider.value = mixRatio;
            changePlayerVolume(mixRatio);
        }, i * 20);
    }
}

function changePlayerVolume(mixRatio) {
    var player1Vol = 0;
    var player2Vol = 0;

    if (mixRatio <= 50) {
        player1Vol = 100;
        player2Vol = mixRatio * 2;
    } else {
        player1Vol = (100 - mixRatio) * 2;
        player2Vol = 100;
    }

    if (player1) player1.volume = player1Vol / 100;
    if (player2) player2.volume = player2Vol / 100;

    if (mixerOutput) mixerOutput.innerHTML = mixRatio;
    if (chFillA) chFillA.style.width = player1Vol + "%";
    if (chFillB) chFillB.style.width = player2Vol + "%";
    if (volValA) volValA.textContent = player1Vol + "%";
    if (volValB) volValB.textContent = player2Vol + "%";
}

function displayMP3s(rootDir, exact = false) {
    let data = {};
    let count = 0;

    if (!rootDir) {
        let container = document.getElementById('playList');
        if (container) container.innerHTML = "";
        return;
    }

    // The special 'root' directory should only list files directly in the root folder
    if (rootDir.toLowerCase() === 'root') {
        exact = true;
    }

    for (var key in mp3DB) {
        if (exact) {
            if (key.toLowerCase() === rootDir.toLowerCase()) {
                data[key] = mp3DB[key];
                count++;
            }
        } else {
            if (key.toLowerCase().includes(rootDir.toLowerCase())) {
                data[key] = mp3DB[key];
                count++;
            }
        }
    }

    let htmlString = '';
    if (count === 1) {
        htmlString = generateHtmlTreeFromArrayDict(data);
    } else {
        htmlString = generateHtmlTableFromArrayDict(data);
    }
    let container = document.getElementById('playList');
    if (container) container.innerHTML = htmlString;

    const dirSelect = document.getElementById("dirSelect");
    if (dirSelect) {
        let found = Array.from(dirSelect.options).some(opt => opt.value.toLowerCase() === rootDir.toLowerCase());
        dirSelect.value = found ? rootDir : '';
    }
}

    let container = document.getElementById('playList');

// Process DB & Directory Dropdown Population
function processDB(data) {
    mp3DB = data;
    let rootDirs = new Set();

    for (const fileName in mp3DB) {
        let parts = fileName.split('/');
        rootDirs.add(parts[0]);
    }

    // Sort directories alphabetically, placing 'root' first
    const sortedDirs = Array.from(rootDirs).sort((a, b) => {
        if (a.toLowerCase() === 'root') return -1;
        if (b.toLowerCase() === 'root') return 1;
        return a.localeCompare(b, undefined, { sensitivity: 'base' });
    });

    const selectEl = document.getElementById("dirSelect");
    if (selectEl) {
        let optionsHtml = `<option value="">📁 Browse Directory (${sortedDirs.length})...</option>`;
        for (const dir of sortedDirs) {
            let trackCount = mp3DB[dir] ? mp3DB[dir].length : 0;

            // Count child folders under this directory
            let childFolderCount = 0;
            const prefix = dir.toLowerCase() + '/';
            for (const key in mp3DB) {
                if (key.toLowerCase().startsWith(prefix)) {
                    childFolderCount++;
                }
            }

            let label = '';
            if (childFolderCount > 0 && trackCount === 0) {
                const folderWord = (childFolderCount === 1) ? 'Folder' : 'Folders';
                label = `${dir} (${childFolderCount} ${folderWord})`;
            } else if (childFolderCount > 0 && trackCount > 0) {
                const folderWord = (childFolderCount === 1) ? 'Folder' : 'Folders';
                label = `${dir} (${childFolderCount} ${folderWord}, ${trackCount} tracks)`;
            } else {
                label = (dir.toLowerCase() === 'root') ? `root (${trackCount} tracks)` : `${dir} (${trackCount} tracks)`;
            }

            optionsHtml += `<option value="${dir}">${label}</option>`;
        }
        selectEl.innerHTML = optionsHtml;
    }

    console.log("Loaded " + sortedDirs.length + " root directories.");
}

function onDirSelectChange(val) {
    if (!val) return;
    // If it's root or an exact leaf folder in mp3DB without child folders, use exact match
    let hasChildFolders = false;
    const prefix = val.toLowerCase() + '/';
    for (const key in mp3DB) {
        if (key.toLowerCase().startsWith(prefix)) {
            hasChildFolders = true;
            break;
        }
    }
    let isExact = (val.toLowerCase() === 'root') || (mp3DB[val] && !hasChildFolders);
    displayMP3s(val, isExact);
}

function clearSearch() {
    const searchEl = document.getElementById("search");
    if (searchEl) searchEl.value = '';
    const dirSelect = document.getElementById("dirSelect");
    if (dirSelect) dirSelect.value = '';
    clearPlayList();
}

// Read database from audiodb.txt
async function readFileAndCreateDirectoryDictionary(fileUrl) {
    try {
        const response = await fetch(fileUrl);
        const fileContent = await response.text();

        const directoryDictionary = {};
        const seenPaths = new Set();

        const lines = fileContent.split('\n');
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;

            const parts = line.split('\t');
            if (parts.length < 5) continue;

            const durationSec = parts[1];
            const bitrateBps = parts[2];
            const fullFileName = parts[4].trim();
            if (!fullFileName) continue;

            // Deduplicate records (due to legacy hash IDs in audiodb.txt)
            if (seenPaths.has(fullFileName)) {
                continue;
            }
            seenPaths.add(fullFileName);

            // Determine parent directory & group root files into "root"
            let parentDirectory = "root";
            if (fullFileName.includes('/')) {
                const pathParts = fullFileName.split('/');
                parentDirectory = pathParts.slice(0, -1).join('/');
            }

            // Extract formatted play time and bitrate
            const isFlac = fullFileName.toLowerCase().endsWith('.flac');
            const playTime = toHHMMSS(durationSec);
            let bitrateNum = Number(bitrateBps);
            let bitrate = isNaN(bitrateNum) ? "" : Math.round(bitrateNum / 1000) + " kbs";
            if (isFlac) {
                bitrate += " (FLAC)";
            }
            const infoString = playTime + " / " + bitrate;
            infoDictionary[fullFileName] = [infoString, durationSec, bitrate];

            if (!directoryDictionary[parentDirectory]) {
                directoryDictionary[parentDirectory] = [];
            }

            directoryDictionary[parentDirectory].push(fullFileName);
        }

        return directoryDictionary;

    } catch (error) {
        console.error('Error reading file from URL:', error);
        return {}; 
    }
}
